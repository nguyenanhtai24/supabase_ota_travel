services:
  - type: web
    name: supabase-ota-travel-fastapi
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false  # Điền thủ công trên Render Dashboard
      - key: API_SECRET_KEY
        sync: false  # Điền thủ công trên Render Dashboard — token xác thực API
